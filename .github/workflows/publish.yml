name: Publish

# Trusted Publishing (OIDC): no API token. One-time setup on PyPI (project africa-coord-bus, Publishing settings):
# owner gabrielmahia, repository africa-coord-bus, workflow publish.yml, environment pypi.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/africa-coord-bus
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3 (release/v1 on 2026-11-10)
