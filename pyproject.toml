[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "africa-coord-bus"
version = "0.4.0"
description = "Coordination event bus connecting East Africa MCP servers — drought alerts cascade to insurance, health, and agricultural advisory in real time"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["mcp","africa","coordination","event-bus","east-africa","drought","health","kenya"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gabrielmahia/africa-coord-bus"
Repository = "https://github.com/gabrielmahia/africa-coord-bus"
Documentation = "https://github.com/gabrielmahia/nairobi-stack"
"MCP Registry" = "https://registry.modelcontextprotocol.io"
Datasets = "https://huggingface.co/gmahia"
Evaluation = "https://github.com/gabrielmahia/kipimo"

[tool.hatch.build.targets.wheel]
packages = ["src/africa_coord_bus"]

[tool.ruff.lint]
# Pinned ruff in CI; these are documented, intentional patterns rather than debt:
#   BLE001/TRY004 — adapters and feed loops catch broadly ON PURPOSE so one bad
#                   source cannot sink an entire run (see adapters/pipeline).
#   S112          — `continue` on exception is the intended degrade-gracefully path.
#   PLW1510       — test subprocess calls assert on returncode explicitly.
#   C408/SIM103/RUF059/EXE001 — style-only; not worth churning working code.
ignore = ["BLE001", "TRY004", "S112", "PLW1510", "C408", "SIM103", "RUF059", "EXE001", "E501"]
